name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eia
          POSTGRES_PASSWORD: eia
          POSTGRES_DB: eia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eia -d eia_test" --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://eia:eia@localhost:5432/eia_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Typecheck
        run: mypy app
      - name: Tests (unit + integration on PostgreSQL)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eia
          POSTGRES_PASSWORD: eia
          POSTGRES_DB: eia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eia -d eia" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://eia:eia@localhost:5432/eia
      BACKEND_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          pip install -r backend/requirements.txt pytest playwright
          python -m playwright install --with-deps chromium
          cd frontend && npm ci && npm run build
      - name: Start services
        run: |
          cd backend && alembic upgrade head && (uvicorn app.main:app --port 8000 &) && cd ..
          cd frontend && (npm run start &) && cd ..
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
      - name: E2E (desktop / tablet / mobile)
        run: pytest -q e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
